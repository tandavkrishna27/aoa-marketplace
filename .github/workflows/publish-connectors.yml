name: Publish connectors (guarded)

# Manual, artifact-pinned publisher for the connectors.json CDN artifact.
#
# WHY THIS IS SEPARATE FROM aggregate.yml (which auto-publishes catalog.json):
# a connector entry with trust.tier "verified" authorizes host command execution
# on every consuming AoA instance — the D7 transport gate admits a catalog+verified
# stdio connector without cross-checking a trusted-source allowlist. connectors.json
# is therefore a code-execution AUTHORIZATION surface, and must never be published as
# a side effect of a content push. This workflow publishes it only:
#   - on a deliberate manual dispatch,
#   - from an EXACT reviewed main SHA (source_sha), verified to be main history,
#   - whose regenerated bytes match a pre-computed digest (artifact_sha256), and
#   - behind a protected environment (a required reviewer approves the run).
# ROLLBACK: re-dispatch with an earlier good source_sha to republish that version.
# The CDN file is NEVER deleted — clients keep last-known-good on a fetch failure,
# so a 404 is strictly worse than a stale-but-valid envelope.
#
# ==> REQUIRED ONE-TIME SETUP (org admin) — this workflow is NOT safe to use until
#     both are done, because the environment gate is the ONLY human check between
#     "anyone with workflow-dispatch access" and "republish a verified stdio
#     connector (host code-exec) to every consumer":
#       1. Create a `connectors-publish` environment (Settings -> Environments)
#          with a REQUIRED reviewer.
#       2. Set that environment's deployment branch rule to `main` only.
#     The reviewer MUST confirm source_sha is not an earlier main state that
#     contained a connector since removed for cause (ancestry alone permits replay).
#
# HOW TO PUBLISH:
#   1. locally, checked out at the reviewed main SHA:
#        SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" pnpm aggregate-connectors
#        sha256sum dist/connectors.json      # <- that hash is artifact_sha256
#   2. dispatch with dry_run=true; review the connectors-only diff in the run summary.
#   3. dispatch with dry_run=false; approve the environment gate; it publishes.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-hex main commit SHA to build connectors.json from
        required: true
        type: string
      artifact_sha256:
        description: Expected sha256 of the regenerated dist/connectors.json (pin the exact reviewed bytes)
        required: true
        type: string
      dry_run:
        description: Preview only — print the connectors-only CDN diff + digest and do NOT publish
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-connectors
  cancel-in-progress: false

jobs:
  publish:
    environment: connectors-publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Validate inputs
        env:
          SRC: ${{ inputs.source_sha }}
          DIGEST: ${{ inputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SRC" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be 40 lowercase hex characters"; exit 1; }
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::artifact_sha256 must be 64 lowercase hex characters"; exit 1; }

      - name: Checkout the exact source SHA (detached)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm the SHA is reviewed main history
        env:
          SRC: ${{ inputs.source_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rel="$(gh api "repos/$REPO/compare/$SRC...main" --jq '.status')"
          echo "relationship of $SRC to main: $rel"
          [[ "$rel" == "ahead" || "$rel" == "identical" ]] || {
            echo "::error::source_sha is not an ancestor of main — refusing to publish an unreviewed revision"
            exit 1
          }

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate + validate connectors.json (reproducible)
        run: |
          set -euo pipefail
          # Derive generatedAt from the source commit time so the output is a pure
          # function of source_sha (see aggregate-connectors.ts) — this is what makes
          # the digest pin below meaningful.
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          pnpm aggregate-connectors

      - name: Assert exact artifact digest
        env:
          SRC: ${{ inputs.source_sha }}
          EXPECTED: ${{ inputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum dist/connectors.json | awk '{print $1}')"
          echo "generated digest: $actual"
          echo "expected  digest: $EXPECTED"
          [[ "$actual" == "$EXPECTED" ]] || {
            echo "::error::connectors.json digest mismatch — source $SRC does not produce the pinned bytes (drift, wrong SHA, or tampering). Refusing to publish."
            exit 1
          }

      - name: Connectors-only diff + preview
        # Anonymous HTTPS clone of the public CDN repo — no deploy key on disk during a
        # dry run. The key is loaded only in the publish step below.
        env:
          SRC: ${{ inputs.source_sha }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set +e
          git clone --depth 1 https://github.com/tandavkrishna27/aoa-marketplace-cdn.git /tmp/cdn-ro 2>/dev/null || mkdir -p /tmp/cdn-ro
          [ -f /tmp/cdn-ro/connectors.json ] || printf '%s' '{"schemaVersion":"","entries":[]}' > /tmp/cdn-ro/connectors.json
          echo "=== connectors.json diff (CDN current -> candidate) ==="
          diff -u /tmp/cdn-ro/connectors.json dist/connectors.json
          echo "=== end diff (empty above == byte-identical, nothing to publish) ==="
          {
            echo "### Connector publish preview"
            echo ""
            echo "- source_sha: \`$SRC\`"
            echo "- digest: \`$(sha256sum dist/connectors.json | awk '{print $1}')\`"
            echo "- entries: \`$(node -p "require('./dist/connectors.json').entries.length")\`"
            echo "- dry_run: \`$DRY\`"
            if [ "$DRY" = "false" ]; then
              echo ""
              echo "> **WARNING:** Publishing to the live CDN. Confirm this run was human-approved via the \`connectors-publish\` environment and that \`source_sha\` is not a since-removed-for-cause state."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish connectors.json to CDN
        if: ${{ inputs.dry_run == false }}
        env:
          SRC: ${{ inputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CDN_DEPLOY_KEY: ${{ secrets.CDN_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$CDN_DEPLOY_KEY" > ~/.ssh/cdn_deploy_key
          chmod 600 ~/.ssh/cdn_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/cdn_deploy_key -o IdentitiesOnly=yes"
          git clone git@github.com:tandavkrishna27/aoa-marketplace-cdn.git /tmp/cdn
          cp dist/connectors.json /tmp/cdn/connectors.json
          cd /tmp/cdn
          git config user.email "ci@armyofagents.org"
          git config user.name "AoA Connector Publisher"
          git add connectors.json
          if git diff --cached --quiet; then
            echo "connectors.json unchanged on the CDN; nothing to publish"
          else
            git commit -m "chore(connectors): publish from source $SRC (run $RUN_ID attempt $RUN_ATTEMPT)"
            git push origin main
            echo "Published connectors.json to CDN (source $SRC)"
          fi

      - name: Clean deploy key
        if: ${{ always() }}
        run: rm -f ~/.ssh/cdn_deploy_key
